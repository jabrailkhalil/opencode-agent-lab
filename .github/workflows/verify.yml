name: Verify public lab
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run doctor -- --json
      - run: npm start
      - run: npm run doctor -- --json
      - run: npm run smoke
      - run: npm stop
        if: always()
