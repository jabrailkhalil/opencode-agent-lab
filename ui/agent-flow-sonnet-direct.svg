<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1944" viewBox="0 0 1260 1944" role="img" aria-labelledby="title desc"><title id="title">Sonnet · прямые задания · порядок заданий</title><desc id="desc">Ведущий выбирает роль для каждого задания. Стрелки показывают порядок обращений, подписи справа — входные данные и сохранённый результат.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9ba9bf" stroke-width="1.5"/></marker></defs><rect width="1260" height="1944" rx="18" fill="#f7f9fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="46" font-size="28" fill="#273249" font-weight="700">Sonnet · прямые задания</text><text x="32" y="78" font-size="16" fill="#748299" font-weight="400">Порядок отправки заданий и передачи файлов · источник: сохранённые этапы прогона</text><rect x="32" y="102" width="1196" height="102" rx="12" fill="#edf2ff" stroke="#d7e0fa"/><text x="52" y="132" font-size="20" fill="#3b55a0" font-weight="650">Ведущий управляет каждым обращением</text><text x="52" y="160" font-size="17" fill="#273249" font-weight="400">Выбирает роль → передаёт конкретные входы → отправляет промпт → получает ответ и файлы.</text><text x="52" y="186" font-size="16" fill="#65748a" font-weight="400">Следующее задание может снова получить аналитик, дизайнер или тестировщик. Роли не вызывают друг друга.</text><text x="32" y="237" font-size="14" fill="#748299" font-weight="400">№</text><text x="87" y="237" font-size="16" fill="#4c63b6" font-weight="650">Аналитик</text><text x="245" y="237" font-size="16" fill="#947249" font-weight="650">Дизайнер</text><text x="403" y="237" font-size="16" fill="#2c8171" font-weight="650">Разработчик</text><text x="561" y="237" font-size="16" fill="#8c5e9d" font-weight="650">Тестировщик</text><text x="738" y="237" font-size="16" fill="#65748a" font-weight="650">Вход → действие → результат</text><path d="M151 252 V1852" stroke="#e1e7f0" 