<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лаборатория агентов</title><link rel="stylesheet" href="/checkpoint-console.css"></head><body>
<header><a class="brand" href="/#overview"><span class="brand-icon">П</span><b>Поток<small>Лаборатория агентов</small></b></a><nav><span class="badge">Сохранённый прогон</span><div class="segmented"><button data-profile="claude">Claude</button><button data-profile="qwen">Qwen</button></div><a id="opencode" target="_blank" rel="noopener">OpenCode ↗</a><details class="settings"><summary>Параметры</summary><div><label>Источник ответов<select id="native-mode"><option value="recording">OpenCode: запись</option><option value="live">OpenCode: живой API</option></select></label><label>Маршрут<select id="mode"><option value="base">Разработка с нуля</option><option value="errors">Четыре типа ошибок</option></select></label><button id="reset">Начать с нуля</button><a href="/guide.pdf" target="_blank">Пошаговый PDF ↗</a></div></details></nav></header>
<main><aside><div class="aside-label">ХОД ДЕМОНСТРАЦИИ</div><div id="steps"></div><div class="aside-footer"><p id="model"></p><span class="status-dot"></span> Локальный стенд</div></aside><section class="content">
<div class="stage"><div><small id="number"></small><h1 id="title">Загрузка…</h1><p id="role"></p></div><div class="arrows"><button id="previous" aria-label="Предыдущий экран">←</button><button id="next" class="primary">Далее →</button></div></div><div class="sync-strip"><span id="status" role="status"></span><button id="follow-current">К текущему ответу ↗</button></div>
<section id="overview-panel" hidden></section><div id="stage-content">
<section id="material-tour" aria-label="Материалы внутри этапа" hidden><div class="tour-controls"><div><small id="tour-number"></small><strong id="tour-title"></strong></div><button id="tour-previous" aria-label="Предыдущий материал">←</button><button id="tour-next" aria-label="Следующий материал">→</button></div><details id="tour-speaker"><summary>Что происходит</summary><p id="tour-say"></p></details><p id="tour-focus-text" aria-live="polite" hidden></p><small id="tour-finish" hidden></small></section>
<section id="stage-summary"></section><div id="quick-files"></div><div class="tabs"><button data-tab="result">Ответ</button><button data-tab="product">Приложение</button><button data-tab="files">Файлы</button><button data-tab="screens">До / после</button><button data-tab="roles">Роли</button><button data-tab="document" id="document-tab" hidden>Документ</button><button id="restore-selected">Продолжить отсюда ↗</button></div>
<section id="roles-panel" hidden><div id="roles-content" class="markdown"></div></section><section id="result-panel"><div id="finding"></div><div id="metrics"></div><article id="result" class="markdown"></article></section><section id="product-panel" hidden><p class="panel-caption">Версия выбранного этапа <a id="external-product" target="_blank" rel="noopener">Открыть отдельно ↗</a></p><iframe id="product" title="Версия приложения"></iframe></section><section id="files-panel" hidden><div id="files"></div></section><section id="screens-panel" hidden><div id="screens"></div></section><section id="comparison-panel" hidden><div id="comparison"></div></section><section id="document-panel" hidden><div class="document-tools"><strong id="document-title"></strong><a id="document-source" target="_blank" rel="noopener">Исходник ↗</a><button id="close-document">Закрыть</button></div><div id="document-sections"></div><article id="document-content" class="markdown"></article></section>
</div></section></main><script type="module" src="/checkpoint-console.js"></script></body></html>
