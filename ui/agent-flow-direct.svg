)"/><rect x="848" y="112" width="240" height="120" rx="15" fill="white" stroke="#dfe6f2"/><rect x="865" y="129" width="29" height="29" rx="8" fill="#eef1f6"/><text x="873" y="150" font-size="16" font-weight="700" fill="#365cf5">4</text><text x="865" y="183" font-size="19" font-weight="650" fill="#24324a">Тестировщик</text><text x="865" y="211" font-size="13" fill="#7b8aa1">Проверка результата</text><path d="M968 239 V278 H696 V242" fill="none" stroke="#8291ab" stroke-width="1.8" marker-end="url(#arrow)"/><text x="746" y="304" font-size="13" fill="#7b8aa1">дефект → исправление → повторная проверка</text><text x="32" y="329" font-size="13" fill="#7b8aa1">Критерии уточняются через задания и отчёты ролей</text></g></svg>