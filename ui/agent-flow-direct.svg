<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="840" viewBox="0 0 1260 840" role="img" aria-labelledby="title desc"><title id="title">Прямые задания: входы, роли и уточнения</title><desc id="desc">Ведущий выбирает роль для каждого задания. Стрелки показывают порядок обращений, подписи справа — входные данные и сохранённый результат.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9ba9bf" stroke-width="1.5"/></marker></defs><rect width="1260" height="840" rx="18" fill="#f7f9fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="46" font-size="28" fill="#273249" font-weight="700">Без OpenSpec · уточнения через задания и отчёты</text><text x="32" y="78" font-size="17" fill="#748299" font-weight="400">OpenCode — среда ролей. Ведущий выбирает, кому и когда отправить следующее задание.</text><rect x="32" y="110" width="350" height="138" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="50" y="141" font-size="21" fill="#4c63b6" font-weight="650">1. Входные договорённости</text><text x="50" y="173" font-size="16" fill="#65748a" font-weight="400">Бриф, интерфейсы, seed-данные, референс</text><text x="50" y="194" font-size="16" fill="#65748a" font-weight="400">UI и исходные тесты.</text><rect x="430" y="110" width="798" height="138" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="448" y="141" font-size="21" fill="#4c63b6" font-weight="650">2. Аналитик получает первое задание</text><text x="448" y="173" font-size="16" fill="#65748a" font-weight="400">Анализирует бриф, фиксирует формулы и неоднозначности в ANALYSIS.md.</text><path d="M385 178 H425" stroke="#9ba9bf" stroke-width="2" marker-end="url(#arrow)"/><path d="M829 250 V284" stroke="#9ba9bf" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="290" width="1196" height="142" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="50" y="321" font-size="21" fill="#4c63b6" font-weight="650">Общий контекст: бриф, анализ и отчёты</text><text x="50" y="353" font-size="16" fill="#65748a" font-weight="400">Нет отдельной валидации артефактов OpenSpec. Ведущий передаёт каждой роли нужные документы и новые наблюдения в очередном задании.</text><rect x="32" y="478" width="384" height="154" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="50" y="509" font-size="21" fill="#947249" font-weight="650">Дизайнер</text><text x="50" y="541" font-size="16" fill="#65748a" font-weight="400">Читает правила и анализ. Создаёт</text><text x="50" y="562" font-size="16" fill="#65748a" font-weight="400">DESIGN-PLAN.md.</text><path d="M224 434 V472" stroke="#9ba9bf" stroke-width="2" marker-end="url(#arrow)"/><rect x="438" y="478" width="384" height="154" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="456" y="509" font-size="21" fill="#2c8171" font-weight="650">Разработчик</text><text x="456" y="541" font-size="16" fill="#65748a" font-weight="400">Получает план, контракт и бриф. Пишет</text><text x="456" y="562" font-size="16" fill="#65748a" font-weight="400">dist/; запускает тесты.</text><path d="M630 434 V472" stroke="#9ba9bf" stroke-width="2" marker-end="url(#arrow)"/><rect x="844" y="478" width="384" height="154" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="862" y="509" font-size="21" fill="#8c5e9d" font-weight="650">Тестировщик</text><text x="862" y="541" font-size="16" fill="#65748a" font-weight="400">Читает код, бриф и тесты. Проверяет;</text><text x="862" y="562" font-size="16" fill="#65748a" font-weight="400">записывает QA-RESULTS.md.</text><path d="M1036 434 V472" stroke="#9ba9bf" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="680" width="1196" height="110" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="50" y="711" font-size="21" fill="#4c63b6" font-weight="650">Новые наблюдения → адресное задание нужной роли</text><text x="50" y="743" font-size="16" fill="#65748a" font-weight="400">QA/браузер → дизайнер при проблеме раскладки → разработчик → повторная проверка → аналитик сводит итог и ограничения.</text><path d="M1215 730 H1240 V360 H1231" fill="none" stroke="#9ba9bf" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="819" font-size="16" fill="#748299" font-weight="400">Точная очередность обращений различается у Sonnet и Qwen и показана в отдельной схеме каждой ветки.</text></g></svg>
