<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1862" viewBox="0 0 1260 1862" role="img" aria-labelledby="title desc"><title id="title">Qwen 3.8 Flash + OpenSpec · порядок заданий</title><desc id="desc">Ведущий выбирает роль для каждого задания. Стрелки показывают порядок обращений, подписи справа — входные данные и сохранённый результат.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9ba9bf" stroke-width="1.5"/></marker></defs><rect width="1260" height="1862" rx="18" fill="#f7f9fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="46" font-size="28" fill="#273249" font-weight="700">Qwen 3.8 Flash + OpenSpec</text><text x="32" y="78" font-size="16" fill="#748299" font-weight="400">Порядок отправки заданий и передачи файлов · источник: сохранённые этапы прогона</text><rect x="32" y="102" width="1196" height="102" rx="12" fill="#edf2ff" stroke="#d7e0fa"/><text x="52" y="132" font-size="20" fill="#3b55a0" font-weight="650">Ведущий управляет каждым обращением</text><text x="52" y="160" font-size="17" fill="#273249" font-weight="400">Выбирает роль → передаёт конкретные входы → отправляет промпт → получает ответ и файлы.</text><text x="52" y="186" font-size="16" fill="#65748a" font-weight="400">Следующее задание может снова получить аналитик, дизайнер или тестировщик. Роли не вызывают друг друга.</text><text x="32" y="237" font-size="14" fill="#748299" font-weight="400">№</text><text x="87" y="237" font-size="16" fill="#4c63b6" font-weight="650">Аналитик</text><text x="245" y="237" font-size="16" fill="#947249" font-weight="650">Дизайнер</text><text x="403" y="237" font-size="16" fill="#2c8171" font-weight="650">Разработчик</text><text x="561" y="237" font-size="16" fill="#8c5e9d" font-weight="650">Тестировщик</text><text x="738" y="237" font-size="16" fill="#65748a" font-weight="650">Вход → действие → результат</text><path d="M151 252 V1720" stroke="#e1e7f0" stroke-dasharray="4 6"/><path d="M309 252 V1720" stroke="#e1e7f0" stroke-dasharray="4 6"/><path d="M467 252 V1720" stroke="#e1e7f0" stroke-dasharray="4 6"/><path d="M625 252 V1720" stroke="#e1e7f0" stroke-dasharray="4 6"/><text x="32" y="310" font-size="19" fill="#748299" font-weight="600">01</text><rect x="81" y="280" width="140" height="88" rx="12" fill="#ffffff" stroke="#4c63b6"/><text x="94" y="304" font-size="15" fill="#4c63b6" font-weight="650">Аналитик</text><text x="94" y="327" font-size="12" fill="#273249" font-weight="400">OpenSpec:</text><text x="94" y="344" font-size="12" fill="#273249" font-weight="400">требования и…</text><text x="94" y="357" font-size="11" fill="#748299" font-weight="400">qspec-01</text><path d="M221 318 H712" stroke="#b9c4d6" stroke-dasharray="4 5" marker-end="url(#arrow)"/><rect x="730" y="277" width="498" height="112" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="746" y="298" font-size="10" fill="#7c8ba2" font-weight="650">ВХОД</text><text x="800" y="298" font-size="12" fill="#273249" font-weight="400">Бриф, интерфейсы, данные, OpenSpec workflow</text><text x="746" y="335" font-size="10" fill="#7c8ba2" font-weight="650">ЗАДАЧА</text><text x="800" y="335" font-size="12" fill="#273249" font-weight="400">Записать проверяемые правила и задачи до реализации</text><text x="746" y="371" font-size="10" fill="#7c8ba2" font-weight="650">ВЫХОД</text><text x="800" y="371" font-size="11" fill="#425b84" font-weight="400">ANALYSIS.md; proposal.md; spec.md; design.md; tasks.md</text><path d="M151 368 V393 H151 V409" fill="none" stroke="#9ba9bf" stroke-width="1.8" marker-end="url(#arrow)"/><text x="32" y="442" font-size="19" fill="#748299" font-weight="600">02</text><rect x="81" y="412" width="140" height="88" rx="12" fill="#ffffff" stroke="#4c63b6"/><text x="94" y="436" font-size="15" fill="#4c63b6" font-weight="650">Аналитик</text><text x="94" y="459" font-size="12" fill="#273249" font-weight="400">Исправление</text><text x="94" y="476" f